<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toca do Texugo · parear</title>
<style>
  :root { --bg: #0d0d0d; --card: #171717; --line: #2a2a2a; --text: #f2f2f2; --muted: #8a8a8a; --accent: #e8b04a; --erro: #ff6b5e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  main { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 8px 0; color: var(--muted); }
  #codigo { width: 100%; margin: 22px 0 14px; padding: 14px 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
            border-radius: 12px; font: 600 44px/1 ui-monospace, monospace; letter-spacing: .35em; text-align: center; text-indent: .35em; }
  #codigo:focus { outline: none; border-color: var(--accent); }
  #mostra { margin: 26px 0 10px; font: 700 72px/1 ui-monospace, monospace; letter-spacing: .2em; color: var(--accent); }
  button { min-height: 56px; width: 100%; margin-top: 10px; border: 0; border-radius: 12px; font: 600 19px system-ui, sans-serif; cursor: pointer; }
  #entrar { background: var(--accent); color: #111; }
  #pedir { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  #msg { min-height: 1.4em; }
  #msg.erro { color: var(--erro); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🦡 Toca do Texugo</h1>

  <!-- No proprio PC: mostra o codigo que o tablet tem que digitar -->
  <section id="local" hidden>
    <p>Código para o tablet</p>
    <div id="mostra">——————</div>
    <p id="local-msg">Peça um código no tablet.</p>
  </section>

  <!-- No tablet: digita o codigo que apareceu no PC -->
  <section id="remoto" hidden>
    <p>Este aparelho ainda não foi pareado. Peça um código e digite o que aparecer no PC.</p>
    <input id="codigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="código">
    <button id="entrar" disabled>Entrar</button>
    <button id="pedir">Pedir código</button>
    <p id="msg"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, { method: "POST", headers: { "X-Dash": "1", "Content-Type": "application/json" },
                                         body: JSON.stringify(body || {}) });
const msg = (t, erro) => { $("msg").textContent = t; $("msg").classList.toggle("erro", !!erro); };
const minutos = s => s >= 60 ? `${Math.ceil(s / 60)} min` : `${s} s`;

async function estado() {
  try { return await (await fetch("/api/parear", { cache: "no-store" })).json(); } catch (e) { return null; }
}

// No PC o codigo vem no /api/parear (so pra loopback); a tela se atualiza sozinha
async function local() {
  const e = await estado();
  if (!e) return;
  $("mostra").textContent = e.codigo || "——————";
  $("local-msg").textContent = e.travado ? `Pareamento travado por ${minutos(e.travado)} (erros demais).`
    : e.codigo ? `Vale por mais ${e.expira} s, uma vez só.` : "Peça um código no tablet.";
}

async function pedir() {
  $("pedir").disabled = true;
  try {
    const r = await (await post("/api/parear/pedir")).json();
    if (r.ok) { msg(`Código enviado para o PC. Vale por ${r.expira} s.`); $("codigo").focus(); }
    else if (r.erro === "travado") msg(`Erros demais: tente de novo em ${minutos(r.travado)}.`, true);
    else if (r.erro === "espera") msg(`Aguarde ${r.espera} s para pedir outro.`, true);
  } catch (e) { msg("Sem conexão com o PC.", true); }
  setTimeout(() => { $("pedir").disabled = false; }, 3000);
}

async function entrar() {
  const codigo = $("codigo").value.replace(/\D/g, "");
  if (codigo.length !== 6) return;
  $("entrar").disabled = true;
  try {
    const res = await post("/api/parear", { codigo });
    const r = await res.json();
    if (res.ok) { msg("Pareado."); location.replace("/"); return; }
    $("codigo").value = "";
    if (r.erro === "errado") msg(r.restam ? `Código errado. Restam ${r.restam} tentativas.` : "Código errado. Peça outro.", true);
    else if (r.erro === "sem_codigo") msg("Nenhum código valendo agora. Peça outro.", true);
    else if (r.erro === "travado") msg(`Erros demais: tente de novo em ${minutos(r.travado)}.`, true);
  } catch (e) { msg("Sem conexão com o PC.", true); }
  $("entrar").disabled = $("codigo").value.length !== 6;
}

(async () => {
  const e = await estado();
  if (e && "codigo" in e) {
    $("local").hidden = false;
    local(); setInterval(local, 1000);
    return;
  }
  $("remoto").hidden = false;
  $("codigo").addEventListener("input", ev => {
    ev.target.value = ev.target.value.replace(/\D/g, "").slice(0, 6);
    $("entrar").disabled = ev.target.value.length !== 6;
    if (ev.target.value.length === 6) entrar();
  });
  $("entrar").addEventListener("click", entrar);
  $("pedir").addEventListener("click", pedir);
  if (e && e.travado) msg(`Erros demais: tente de novo em ${minutos(e.travado)}.`, true);
})();
</script>
</body>
</html>
